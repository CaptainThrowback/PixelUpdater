name: Build-Release

on:
  push:
    branches:
      - main
      - develop
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:
    inputs:
      create_release:
        type: boolean
        description: 'Create GitHub release'
        default: false

jobs:
  build:
    name: Create Github release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          submodules: true
          fetch-depth: 0

      # https://github.com/actions/checkout/issues/290
      - name: Preserve tag annotations
        run: git fetch -f origin ${{ github.ref }}:${{ github.ref }}
        if: startsWith(github.ref, 'refs/tags/')

      - name: Get version from git
        id: get_version
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # For tags: Use the standard versioning
            version=$(git describe | sed -E 's/v([0-9]*\.[0-9]*)-([0-9]+)-g([0-9a-f]+)/v\1.r\2.g\3/')
          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            # For PRs: Use PR number and short SHA
            short_sha=$(git rev-parse --short HEAD)
            version="pr-${{ github.event.pull_request.number }}-${short_sha}"
          else
            # For branch builds: Use branch name and short SHA
            branch_name="${GITHUB_REF#refs/heads/}"
            short_sha=$(git rev-parse --short HEAD)
            version="${branch_name}-${short_sha}"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Using version: $version"

      - name: Validate gradle wrapper checksum
        uses: gradle/wrapper-validation-action@v2

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      # Only decode keystore for tag builds or manual builds with release option
      - name: Decode Keystore
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        run: |
          echo -n "${{ secrets.RELEASE_KEYSTORE_BASE64 }}" | base64 -d > keystore.jks

      # Only create signing key for tag builds or manual builds with release option
      - name: Create SSH KEY
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        run: |
          echo "${{ secrets.SIGNING_KEY }}" > pixelupdater.key
          chmod 600 pixelupdater.key

      - name: Build APK
        run: ./gradlew assembleRelease

      # All builds create the zip (Magisk module)
      - name: Build Zip Package
        run: ./gradlew zipRelease

      # Only sign zip and update JSON for tag builds or manual builds with release option
      - name: Sign Release Package
        if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')
        env:
          RELEASE_KEYSTORE: ${{ github.workspace }}/keystore.jks
          RELEASE_KEY_ALIAS: release
          RELEASE_KEY_PASSPHRASE: ${{ secrets.RELEASE_KEY_PASSPHRASE }}
          RELEASE_KEYSTORE_PASSPHRASE: ${{ secrets.RELEASE_KEYSTORE_PASSPHRASE }}
          SIGNING_KEY: ${{ github.workspace }}/pixelupdater.key
          SIGNING_KEY_PASSPHRASE: ${{ secrets.SIGNING_KEY_PASSPHRASE }}
        run: |
          ./gradlew signReleaseZip
          ./gradlew updateJsonRelease

      # Create a safe version string for artifact naming
      - name: Create Safe Version String
        id: safe_version
        run: |
          # Replace slashes with hyphens in the version name for artifact names
          SAFE_VERSION=$(echo ${{ steps.get_version.outputs.version }} | sed 's/\//-/g')
          echo "version=$SAFE_VERSION" >> "$GITHUB_OUTPUT"
          echo "Using safe version: $SAFE_VERSION"

      # For PR and branch builds, create a debug directory and copy artifacts
      - name: Prepare Debug Artifacts
        if: ${{ !(startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release == 'true')) }}
        run: |
          # Replace slashes with hyphens in the version name for file paths; needed for feature branches
          SAFE_VERSION=$(echo ${{ steps.get_version.outputs.version }} | sed 's/\//-/g')

          mkdir -p app/build/distributions/debug
          cp app/build/outputs/apk/release/*.apk "app/build/distributions/debug/PixelUpdater-${SAFE_VERSION}-debug.apk"
          cp app/build/distributions/release/*.zip "app/build/distributions/debug/PixelUpdater-${SAFE_VERSION}-debug.zip"

      - name: Debug list artifacts
        run: |
          ls -lR app/build/distributions/

      # Upload artifacts for all builds
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: PixelUpdater-artifacts-${{ steps.safe_version.outputs.version }}
          path: |
            app/build/distributions/release/*
            app/build/distributions/debug/*

      # Only upload release-info for tagged releases
      - name: Upload release-info
        uses: actions/upload-artifact@v4
        id: upload_release_info
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: release.json
          path: app/build/distributions/release.json

      # Only get annotation for tagged releases
      - name: Get annotation from git for-each-ref
        id: get_annotation
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          {
            echo 'annotation<<EOF'
            git for-each-ref ${{ github.ref }} --format='%(contents)' | awk '/-BEGIN PGP SIGNATURE-/{exit} {print}'
            echo 'EOF'
          } >> "$GITHUB_OUTPUT"

      # Create GitHub release only for tag builds
      - name: Create release
        id: create_release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: Release ${{ steps.get_version.outputs.version }}
          body: ${{ steps.get_annotation.outputs.annotation }}
          draft: true
          prerelease: false
          files: |
            app/build/distributions/release/PixelUpdater-${{ steps.get_version.outputs.version }}-release.zip
            app/build/distributions/release/PixelUpdater-${{ steps.get_version.outputs.version }}-release.zip.sig
